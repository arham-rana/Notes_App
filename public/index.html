<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Documents</title>
  <meta name="theme-color" content="#dfe7f0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/dist/app.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="backdrop" aria-hidden="true"></div>
  <div class="shell">
    <aside class="sidebar" aria-label="Main">
      <div class="side-head">
        <button class="side-toggle" data-action="toggle-sidebar" aria-label="Hide menu" title="Hide menu"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="19" r="1.3" fill="currentColor"/></svg></button>
      </div>
      <nav class="nav">
        <a class="nav-item" data-view="notes" title="Documents" aria-label="Documents" href="#/documents">
          <svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M10 9H8M16 13H8M16 17H8"/></svg>
          <span>Documents</span>
        </a>
        <a class="nav-item" data-view="reminders" title="Reminders" aria-label="Reminders" href="#/reminders">
          <svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span>Reminders</span>
        </a>
        <a class="nav-item" data-view="calendar" title="Calendar" aria-label="Calendar" href="#/calendar">
          <svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span>Calendar</span>
        </a>
      </nav>
    </aside>
    <div class="sidebar-scrim" data-action="toggle-sidebar" aria-hidden="true"></div>
    <button class="side-reopen" data-action="toggle-sidebar" aria-label="Show menu" title="Show menu"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="19" r="1.3" fill="currentColor"/></svg></button>

    <main class="panel">
      <header class="topbar">
        <button class="icon-btn mobile-menu" data-action="toggle-sidebar" aria-label="Open menu"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="19" r="1.3" fill="currentColor"/></svg></button>
        <div class="global-search">
          <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <label class="sr-only" for="global-search">Search everything</label>
          <input id="global-search" type="search" placeholder="Search documents, reminders, or anything..." autocomplete="off" role="combobox" aria-controls="search-results" aria-expanded="false">
          <kbd>/</kbd>
          <div id="search-results" class="search-results" role="listbox" hidden></div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="alerts-btn" data-action="open-alerts" aria-label="Notifications" aria-expanded="false">
            <svg class="ic" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            <span id="alert-badge" class="badge" hidden>0</span>
          </button>
          <button class="avatar-btn" id="account-btn" data-action="account-menu" aria-label="Account"></button>
        </div>
        <div id="offline" class="offline" role="status" hidden>Can't reach the server. Recent changes may not be saved.</div>
      </header>
      <div id="view" class="view" tabindex="-1">
        <div class="boot"><span class="spinner" aria-hidden="true"></span><span>Loading your documents…</span></div>
      </div>
    </main>
  </div>
  <script type="module" src="/dist/app.js"></script>
</body>
</html>
